plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, 'cs2lootbox.refmap.json'
    config 'cs2lootbox.mixins.json'
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'cs2lootbox.testProjectRoot', projectDir.absolutePath
            workingDirectory project.file('build/music-kit-gametest')
            mods {
                "${mod_id}" { source sourceSets.test }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Each music kit is independently installable; shared geometry stays in the mod.
def musicAssets = file('resourcepacks/cs2lootbox-music/assets/cs2lootbox')
def musicManifest = new File(musicAssets, 'sounds.json')
// The optional audio library need not be present to build the mod itself.
def musicSounds = musicManifest.isFile() ? new groovy.json.JsonSlurper().parse(musicManifest, 'UTF-8') : [:]
def musicLanguage = new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/cs2lootbox/lang/en_us.json'), 'UTF-8')
def musicPackTasks = []
(new File(musicAssets, 'sounds/music').listFiles() ?: []).findAll { it.directory }.sort { it.name }.each { kitDirectory ->
    def kitId = kitDirectory.name
    def kitSounds = musicSounds.findAll { event, definition -> event.startsWith("music.${kitId}.") }
    def soundJson = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(kitSounds)) + '\n'
    def title = musicLanguage["item.cs2lootbox.music_kit_${kitId}"] ?: kitId
    def metadata = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
        pack: [pack_format: 15, description: "CS2 Lootbox - ${title}"]
    ])) + '\n'
    def generated = layout.buildDirectory.dir("generated/music-packs/${kitId}")
    def prepare = tasks.register("prepareMusicPack_${kitId}") {
        inputs.property('sounds', soundJson)
        inputs.property('metadata', metadata)
        outputs.dir(generated)
        doLast {
            def directory = generated.get().asFile
            directory.mkdirs()
            new File(directory, 'pack.mcmeta').setText(metadata, 'UTF-8')
            def definitions = new File(directory, 'assets/cs2lootbox/sounds.json')
            definitions.parentFile.mkdirs()
            definitions.setText(soundJson, 'UTF-8')
        }
    }
    musicPackTasks.add(tasks.register("musicResourcePack_${kitId}", Zip) {
        dependsOn prepare
        archiveFileName = "cs2lootbox-music-${kitId}.zip"
        destinationDirectory = layout.buildDirectory.dir('resourcepacks')
        entryCompression = ZipEntryCompression.STORED
        from generated
        from('resourcepacks/cs2lootbox-music') {
            include "assets/cs2lootbox/sounds/music/${kitId}/*.ogg"
            exclude '**/*.partial.ogg'
            include "assets/cs2lootbox/textures/gui/music/${kitId}.png"
            include "assets/cs2lootbox/textures/musickits/music_kit_${kitId}.png"
        }
        from(new File(musicAssets, "textures/gui/music/${kitId}.png")) {
            rename { 'pack.png' }
        }
    })
}
tasks.register('musicResourcePacks') {
    group = 'build'
    description = 'Builds one optional resource-pack ZIP per music kit, using its GUI artwork as the icon.'
    dependsOn musicPackTasks
    doFirst {
        if (!musicManifest.isFile() || musicPackTasks.isEmpty()) {
            throw new GradleException('Music pack source assets are missing from resourcepacks/cs2lootbox-music; the mod can still be built without them.')
        }
    }
}
tasks.register('musicResourcePack') {
    group = 'build'
    description = 'Alias for musicResourcePacks: builds separate packs for every kit.'
    dependsOn 'musicResourcePacks'
}

tasks.register('musicResourcePackFull', Zip) {
    group = 'build'
    description = 'Builds the complete music collection as one resource pack for CurseForge.'
    archiveFileName = 'cs2lootbox-music-full.zip'
    destinationDirectory = layout.buildDirectory.dir('resourcepacks')
    entryCompression = ZipEntryCompression.STORED
    doFirst {
        if (!musicManifest.isFile()) {
            throw new GradleException('Full music pack source assets are missing from resourcepacks/cs2lootbox-music.')
        }
    }
    from('resourcepacks/cs2lootbox-music') {
        include 'pack.mcmeta'
        include 'assets/cs2lootbox/sounds.json'
        include 'assets/cs2lootbox/sounds/music/**/*.ogg'
        include 'assets/cs2lootbox/textures/gui/music/*.png'
        include 'assets/cs2lootbox/textures/musickits/*.png'
        exclude '**/*.partial.ogg'
    }
    from('docs/curseforge/music-kits-project-logo.png') {
        rename { 'pack.png' }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'musicResourcePack_treeadams_benbromfield_01', 'musicResourcePack_bbnos_01'
    doFirst {
        copy {
            from 'src/test/resources/music_kit_api_check.js'
            into 'build/music-kit-gametest/kubejs/startup_scripts'
        }
    }
}

repositories {

    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    maven {
        url "https://cursemaven.com"
    }
    
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }

    maven {
        url = "https://maven.saps.dev/minecraft"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
	
	 maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
	
    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Apply Mixin AP
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	
    implementation("com.eliotlash.mclib:mclib:20")
	implementation fg.deobf("curse.maven:apocalypselib-1455735:9019998")
    implementation fg.deobf("curse.maven:rhino-416294:6186971")
	implementation fg.deobf("curse.maven:geckolib-388172:8285794")
    implementation fg.deobf("curse.maven:geckomesh-1578592:8282825")
    implementation fg.deobf("curse.maven:ldlib-626676:8830518")
    implementation fg.deobf("curse.maven:kubejs-238086:5853326")
    implementation fg.deobf("curse.maven:rhino-416294:6186971")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'           : 'cs2lootbox.mixins.json',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to re-obfuscate your jar file
    finalizedBy 'reobfJar'
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.register('renderCommandCheck', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.tokyosu.cs2lootbox.client.renderer.RenderCommandCheck'
    workingDir layout.buildDirectory.dir('render-command-check').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.register('heldCaseCacheCheck', JavaExec) {
    group = 'verification'
    description = 'Checks static held poses, GPU mesh reuse and buffer ordering in a hidden GL window.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.tokyosu.cs2lootbox.client.renderer.HeldCaseCacheCheck'
    args projectDir.absolutePath,
            new File(gradle.gradleUserHomeDir, "caches/forge_gradle/minecraft_repo/versions/${minecraft_version}/client-extra.jar").absolutePath
    systemProperty 'org.lwjgl.librarypath', layout.buildDirectory.dir('render-gl-natives').get().asFile.absolutePath
    workingDir layout.buildDirectory.dir('render-cache-check').get().asFile
    doFirst {
        workingDir.mkdirs()
        ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-stb'].each { library ->
            def cache = new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/org.lwjgl/${library}/3.3.1")
            def natives = project.fileTree(cache).matching { include '**/*-natives-windows.jar' }.files
            if (natives.isEmpty()) throw new GradleException("Cached Windows natives missing for ${library}")
            natives.each { nativeJar ->
                project.copy {
                    from project.zipTree(nativeJar)
                    include '*.dll'
                    into layout.buildDirectory.dir('render-gl-natives')
                }
            }
        }
    }
}

tasks.register('musicKitAudioCheck', JavaExec) {
    group = 'verification'
    description = 'Checks preview timing and decodes every built-in music track with Minecraft\'s Vorbis reader.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.tokyosu.cs2lootbox.music.MusicKitAudioCheck'
    args projectDir.absolutePath
    systemProperty 'org.lwjgl.librarypath', layout.buildDirectory.dir('render-gl-natives').get().asFile.absolutePath
    workingDir layout.buildDirectory.dir('music-audio-check').get().asFile
    doFirst {
        workingDir.mkdirs()
        ['lwjgl', 'lwjgl-stb'].each { library ->
            def cache = new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/org.lwjgl/${library}/3.3.1")
            def natives = project.fileTree(cache).matching { include '**/*-natives-windows.jar' }.files
            if (natives.isEmpty()) throw new GradleException("Cached Windows natives missing for ${library}")
            natives.each { nativeJar ->
                project.copy {
                    from project.zipTree(nativeJar)
                    include '*.dll'
                    into layout.buildDirectory.dir('render-gl-natives')
                }
            }
        }
    }
}
